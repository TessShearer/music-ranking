[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VUE_APP_FIREBASE_API_KEY,VUE_APP_FIREBASE_APP_ID,VUE_APP_FIREBASE_AUTH_DOMAIN,VUE_APP_FIREBASE_MESSAGING_SENDER_ID,VUE_APP_FIREBASE_PROJECT_ID,VUE_APP_FIREBASE_STORAGE_BUCKET"

[[redirects]]
  from = "/api/itunes/*"
  to = "https://itunes.apple.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
